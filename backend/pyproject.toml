[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chhaya-backend"
version = "0.1.0"
description = "AWS SAM backend for Chhaya"
requires-python = ">=3.11"
dependencies = [
    "chhaya-engine"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "moto",
    "boto3"
]

[tool.ruff]
target-version = "py311"
line-length = 100
