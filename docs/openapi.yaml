openapi: 3.0.3
info:
  title: Chhaya Backend API
  description: Hyperlocal Heat & Air Exposure Copilot for Outdoor Workers in India.
  version: 0.2.1
servers:
  - url: http://localhost:8787
    description: Local development server
paths:
  /health:
    get:
      summary: Health check
      description: Returns health status, current version, region, and data mode.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 0.2.1
                  region:
                    type: string
                    example: ap-south-1
                  data_mode:
                    type: string
                    example: live
                  time:
                    type: string
                    format: date-time

  /cities:
    get:
      summary: List seeded cities
      description: Returns all pre-configured cities with their geographic coordinates.
      responses:
        '200':
          description: List of cities
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'

  /scenarios:
    get:
      summary: List recorded replay scenarios
      description: Returns 4 historical high-impact weather and air quality days for deterministic replays.
      responses:
        '200':
          description: List of scenarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/Scenario'

  /plan:
    post:
      summary: Generate worker day plan
      description: Computes hourly WBGT and AQI risk, work/rest schedule, and recommendations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '200':
          description: DayPlan generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayPlan'
        '400':
          description: Invalid request or coordinates out of India bounding box
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: City or scenario not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /advise:
    post:
      summary: Generate plain-language worker advisory
      description: Generates grounded shift guidance in English, Hindi, or Tamil pinned to computed evidence cards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdviseRequest'
      responses:
        '200':
          description: Plan and validated advisory generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdviseResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: City or scenario not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /board:
    get:
      summary: Get Risk Board matrix
      description: Returns current and 12-hour peak exposure risk for all standard worker profiles across seeded cities or replay scenarios.
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [live, replay]
            default: live
      responses:
        '200':
          description: Risk Board matrix
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_at:
                    type: string
                    format: date-time
                  mode:
                    type: string
                    enum: [live, replay]
                  cities:
                    type: array
                    items:
                      type: object

  /stats:
    get:
      summary: Get global impact statistics
      description: Live metrics including plans generated, dangerous hours flagged, and crew numbers.
      responses:
        '200':
          description: Global metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalStats'

  /audit:
    get:
      summary: Get recent audit events
      description: Append-only anonymized log of system actions (no PII stored).
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Recent audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit_events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'

  /crews:
    get:
      summary: List all registered crews
      description: Publicly viewable list of registered anonymous worker groups.
      responses:
        '200':
          description: List of crews
          content:
            application/json:
              schema:
                type: object
                properties:
                  crews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Crew'
    post:
      summary: Register a new worker crew
      description: Creates an anonymous crew profile (requires X-Chhaya-Passcode).
      parameters:
        - name: X-Chhaya-Passcode
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCrewRequest'
      responses:
        '201':
          description: Crew created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  crew:
                    $ref: '#/components/schemas/Crew'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid passcode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /crews/{id}:
    get:
      summary: Get crew with live plan summary
      description: Fetches crew details and current exposure risk summary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Crew details with plan summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  crew:
                    $ref: '#/components/schemas/CrewWithPlan'
        '404':
          description: Crew not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a crew
      description: Deletes a registered crew (requires X-Chhaya-Passcode).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Chhaya-Passcode
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Crew deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
                  crew_id:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Crew not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    City:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lat:
          type: number
        lon:
          type: number
        state:
          type: string

    Scenario:
      type: object
      properties:
        id:
          type: string
          enum:
            - delhi-heatwave-2025-06-09
            - delhi-smog-2025-11-23
            - chennai-humid-2025-05-31
            - coimbatore-mild-2025-01-15
          example: delhi-heatwave-2025-06-09
        label:
          type: string
          example: Delhi Extreme Heatwave (Jun 2025)
        city_id:
          type: string
          example: delhi
        date:
          type: string
          example: '2025-06-09'
        max_temp_c:
          type: number
          example: 43.7
        max_pm2_5:
          type: number
          example: 163.0
        source:
          type: string
          example: recorded

    PlanRequest:
      type: object
      required:
        - job_type
      properties:
        city_id:
          type: string
          example: delhi
        scenario:
          type: string
          example: delhi-heatwave-2025-06-09
        lat:
          type: number
          example: 28.61
        lon:
          type: number
          example: 77.23
        job_type:
          type: string
          enum: [RIDER, CONSTRUCTION, VENDOR, SANITATION]
        workload:
          type: string
          enum: [LIGHT, MODERATE, HEAVY]
        sun_exposure:
          type: string
          enum: [FULL, PARTIAL, SHADE]
        preferred_start_hour:
          type: integer
          default: 6
        preferred_end_hour:
          type: integer
          default: 20
        max_shift_hours:
          type: integer
          default: 8

    DayPlan:
      type: object
      properties:
        city_label:
          type: string
        generated_at:
          type: string
          format: date-time
        data_source:
          type: string
          enum: [live, fixture, replay]
        scenario_id:
          type: string
          nullable: true
        recorded_date:
          type: string
          nullable: true
        hours:
          type: array
          items:
            type: object
        windows:
          type: array
          items:
            type: object
        dangerous_windows:
          type: array
          items:
            type: object
        recommended_blocks:
          type: array
          items:
            type: object
        no_safe_window:
          type: boolean
        overall_risk:
          type: string
          enum: [LOW, MODERATE, HIGH, EXTREME]
        hydration:
          type: object
          properties:
            frequent_windows:
              type: array
              items:
                type: object
            guideline:
              type: string
        mask:
          type: object
        seek_help_lines:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            type: object
        assumptions_version:
          type: string

    GlobalStats:
      type: object
      properties:
        plans_generated:
          type: integer
          description: Total number of DayPlans generated across all endpoints
        cities_covered:
          type: integer
          description: Total number of seeded Indian cities covered
        hours_flagged:
          type: integer
          description: Total number of AVOID or REDUCED(15/45) hours across generated plans
        avg_lead_time_hours:
          type: number
          description: Mean hours between plan generation and the start of the first flagged dangerous window (only plans that have one)
        crews_registered:
          type: integer
          description: Total count of active registered worker crews
        alerts_sent:
          type: integer
        advisories_generated:
          type: integer
          description: Total number of LLM / Template worker advisories generated
        llm_first_pass_valid_rate:
          type: number
          nullable: true
          description: Fraction of LLM advisories passing strict validation on the first attempt (null until >0 advisories)
        seeded:
          type: boolean
          description: True if demo counters were seeded via CHHAYA_SEED_DEMO=1

    AuditEvent:
      type: object
      properties:
        id:
          type: string
        event_type:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: object

    Crew:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        city_id:
          type: string
        job_type:
          type: string
        workload:
          type: string
        size:
          type: integer
        created_at:
          type: string

    CrewWithPlan:
      allOf:
        - $ref: '#/components/schemas/Crew'
        - type: object
          properties:
            plan_summary:
              type: object

    CreateCrewRequest:
      type: object
      required:
        - name
        - city_id
        - job_type
      properties:
        name:
          type: string
        city_id:
          type: string
        job_type:
          type: string
          enum: [RIDER, CONSTRUCTION, VENDOR, SANITATION]
        workload:
          type: string
          enum: [LIGHT, MODERATE, HEAVY]
        size:
          type: integer
          default: 1

    AdviseRequest:
      allOf:
        - $ref: '#/components/schemas/PlanRequest'
        - type: object
          properties:
            language:
              type: string
              enum: [en, hi, ta]
              default: en
            advisor_backend:
              type: string
              enum: [bedrock, strands, template]
              default: bedrock

    AdviseResponse:
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/DayPlan'
        advisory:
          $ref: '#/components/schemas/Advisory'

    Advisory:
      type: object
      properties:
        language:
          type: string
          enum: [en, hi, ta]
        sentences:
          type: array
          items:
            $ref: '#/components/schemas/Sentence'
        used_fallback:
          type: boolean
        fallback_reason:
          type: string
          nullable: true
        model_id:
          type: string
        prompt_version:
          type: string
        raw_llm_response:
          type: string
          nullable: true

    Sentence:
      type: object
      properties:
        text:
          type: string
        evidence_ids:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

